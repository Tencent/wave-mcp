[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-mcp"
version = "0.1.0"
description = "Open-source, license-free MCP server for xrun (Xcelium) waveform debug — an Indago/Verisium Debug MCP alternative."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "mcp>=1.2.0",
    "pylibfst>=0.2.1",
    "pyslang>=11.0.0",
    "websockets>=12.0",
]

[project.scripts]
wave-mcp = "wave_mcp.server:main"
wave-session = "wave_mcp.cli.build_session:main"
wave-vcd2fst = "wave_mcp.cli.vcd2fst:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wave_mcp*"]
