<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>wave-mcp viewer</title></head>
<body>
<p id="status" style="font-family: sans-serif; color: #666">Loading wave viewer...</p>
<script>
  // Entry page. Tries to get a service worker in control before entering
  // the shell: the worker restores the `Server: Surfer` header that reverse
  // proxies rewrite, which Surfer needs to detect its streaming backend.
  //
  // Every wait here is BOUNDED. An environment where service workers never
  // become ready (embedded IDE webviews, hardened browser profiles) used to
  // leave this page stuck on navigator.serviceWorker.ready forever, which
  // looked exactly like a blank viewer. Past the budget the shell is
  // entered anyway: the shell probes the backend, says what is happening,
  // and retries there, where recovery is actually possible.
  var EXPECTED_SW_VERSION = 1;   // keep in sync with sw.js SW_VERSION
  var BUDGET_MS = 4000;          // total time spent on the worker, max
  var T0 = Date.now();

  function remaining() { return Math.max(0, BUDGET_MS - (Date.now() - T0)); }

  function setStatus(m) {
    console.log("[view.html] " + m);
    var el = document.getElementById("status");
    if (el) el.textContent = m;
  }

  // Resolve with null when the promise did not settle within the budget.
  function withTimeout(promise, ms) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () { resolve(null); }, ms);
      Promise.resolve(promise).then(
        function (v) { clearTimeout(t); resolve(v); },
        function (e) { clearTimeout(t); reject(e); });
    });
  }

  function queryVersion(worker, timeoutMs) {
    return new Promise(function (resolve) {
      var mc = new MessageChannel();
      var timer = setTimeout(function () { resolve(null); }, timeoutMs);
      mc.port1.onmessage = function (e) {
        clearTimeout(timer);
        resolve(e.data && e.data.version);
      };
      try {
        worker.postMessage({ type: "GET_VERSION" }, [mc.port2]);
      } catch (err) {
        clearTimeout(timer);
        resolve(null);
      }
    });
  }

  function waitControllerChange(timeoutMs) {
    return new Promise(function (resolve) {
      var timer = setTimeout(resolve, timeoutMs);
      navigator.serviceWorker.addEventListener("controllerchange", function () {
        clearTimeout(timer);
        resolve();
      }, { once: true });
    });
  }

  async function tryWorker() {
    if (remaining() <= 300) return false;
    setStatus("Registering service worker...");
    var reg = null;
    try {
      reg = await withTimeout(
        navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" }),
        Math.min(1500, remaining()));
    } catch (e) {
      return false;
    }
    if (!reg) return false;

    setStatus("Waiting for the worker to become ready...");
    var ready = await withTimeout(navigator.serviceWorker.ready,
                                  Math.min(2500, remaining()));
    if (!ready) return false;

    if (!navigator.serviceWorker.controller) {
      setStatus("Waiting for the worker to take control...");
      await waitControllerChange(Math.min(1500, remaining()));
    }
    for (var attempt = 0; attempt < 2 && remaining() > 400; attempt++) {
      var ctrl = navigator.serviceWorker.controller;
      if (!ctrl) return false;
      var v = await queryVersion(ctrl, Math.min(1200, remaining()));
      if (v === EXPECTED_SW_VERSION) return true;
      setStatus("Updating viewer worker (attempt " + (attempt + 1) + ")...");
      try { await reg.update(); } catch (e) { /* best effort */ }
      await waitControllerChange(Math.min(1500, remaining()));
    }
    return false;
  }

  async function go() {
    var swOk = false;
    if ("serviceWorker" in navigator) {
      try { swOk = await tryWorker(); } catch (e) { swOk = false; }
    }
    setStatus(swOk
      ? "Entering the viewer..."
      : "Entering the viewer (worker not in control; the page will retry "
        + "if the backend needs it)...");
    location.replace("/shell.html" + location.search);
  }

  setTimeout(go, 50);
</script>
</body>
</html>
